name: Release
# Callers grant `contents: write` and `actions: read`; a caller must grant every permission the called jobs declare, or the call fails at startup.

on:
  workflow_call:
    inputs:
      plugin-slug:
        description: 'Plugin directory slug. Names the archive, the POT, and the directory the zip unpacks to.'
        type: string
        required: true
      php-version:
        description: 'PHP the build and the smoke environment run. Must satisfy the plugin header "Requires PHP" or WordPress refuses to activate the artifact.'
        type: string
        required: true
      entry-file:
        description: 'Main plugin file carrying the Version header. Empty uses <plugin-slug>.php.'
        type: string
        required: false
        default: ''
      extra-plugins:
        description: 'JSON array of additional wp-env plugin sources installed alongside the artifact during smoke.'
        type: string
        required: false
        default: '[]'
      extra-smoke-commands:
        description: 'JSON array of wp-cli argument strings run as additional smoke assertions.'
        type: string
        required: false
        default: '[]'
      publish:
        description: 'Whether to create the GitHub release. True requires a tag run. False runs everything up to it, which is how this path can be exercised without a tag.'
        type: boolean
        required: false
        default: true

permissions: {}

jobs:
  version-check:
    name: Verify release version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the tag, plugin header, package, and changelog to agree
        env:
          ENTRY_FILE: ${{ inputs.entry-file }}
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
          TAG: ${{ github.ref_name }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          entry_file="${ENTRY_FILE:-$PLUGIN_SLUG.php}"
          plugin_version=$(grep -m 1 '^[[:space:]]*\*[[:space:]]*Version:' "$entry_file" | sed -E 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+).*/\1/' || true)
          package_version=$(jq -r .version package.json)
          changelog_version=$(grep -m 1 '^## ' CHANGELOG.md | sed -E 's/^## \[?([^] ]+)\]? - .*/\1/' || true)

          tag_version=""
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag_version="${TAG#v}"
          elif [ "$PUBLISH" = "true" ]; then
            echo "::error::publish is on, but $TAG is not a tag. Run from a tag to release, or turn publish off to exercise the release path." >&2
            exit 1
          fi

          if [ -z "$plugin_version" ] || [ -z "$package_version" ] || [ -z "$changelog_version" ] \
            || [ "$plugin_version" != "$package_version" ] || [ "$plugin_version" != "$changelog_version" ] \
            || { [ -n "$tag_version" ] && [ "$tag_version" != "$plugin_version" ]; }; then
            echo "::error::release versions disagree: tag=${tag_version:-none} plugin=${plugin_version:-missing} package=${package_version:-missing} changelog=${changelog_version:-missing}" >&2
            exit 1
          fi

  # Releases reuse the full-matrix results proven at the exact tagged commit.
  provenance:
    name: Verify release provenance
    needs: version-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
    steps:
      - name: Verify required workflows passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          required_workflows=(.github/workflows/quality.yml .github/workflows/tests.yml)
          if ! successful_workflows=$(gh api --paginate --method GET \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/actions/runs" \
            --raw-field "head_sha=${SHA}" \
            --raw-field status=success \
            --field per_page=100 \
            --jq '.workflow_runs[] | select(.event == "push" and .conclusion == "success") | .path'); then
            echo "::error::unable to verify workflow runs for ${SHA}; rerun the release after the Actions API is available." >&2
            exit 1
          fi

          missing_workflows=()
          for workflow in "${required_workflows[@]}"; do
            if ! grep -Fqx -- "$workflow" <<<"$successful_workflows"; then
              missing_workflows+=("$workflow")
            fi
          done

          if (( ${#missing_workflows[@]} > 0 )); then
            echo "::error::missing successful workflow run(s) for ${SHA}: ${missing_workflows[*]}. The tagged SHA must be a commit whose Quality and Tests runs are green; re-tag after they pass." >&2
            exit 1
          fi

  build:
    name: Build the release artifact
    needs: version-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2, wp-cli
      - name: Validate changelog
        run: |
          composer install --no-interaction
          composer changelog:validate
      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction
      # wp-cli's own package installer resolves through a composer VCS repository, which reads the GitHub API and needs a credential composer accepts, and composer rejects some of the tokens Actions mints. Installing dist-archive from Packagist into its own directory needs no credential.
      - name: Install the release tooling
        run: |
          mkdir -p "$RUNNER_TEMP/release-tools"
          printf '%s' '{"name":"a8csp/release-tools","require":{}}' > "$RUNNER_TEMP/release-tools/composer.json"
          composer require --no-interaction --working-dir="$RUNNER_TEMP/release-tools" \
            wp-cli/dist-archive-command:3.1.0
      # Only wp-cli's bundled i18n-command may run here: with the release-tools autoloader loaded too, two copies silently break plugin-header detection, which the assertions below catch.
      - name: Generate translation template
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
        run: |
          # Clearing every committed copy first makes the assertions below evidence about this run.
          find . -name "$PLUGIN_SLUG.pot" -not -path './vendor/*' -not -path './node_modules/*' -delete
          wp i18n make-pot ./ --slug="$PLUGIN_SLUG"

          mapfile -t pots < <( find . -name "$PLUGIN_SLUG.pot" -not -path './vendor/*' -not -path './node_modules/*' )
          if [ "${#pots[@]}" -ne 1 ]; then
            echo "::error::make-pot produced ${#pots[@]} copies of $PLUGIN_SLUG.pot, and the archive carries exactly one: ${pots[*]}" >&2
            exit 1
          fi

          # A generic-project fallback also succeeds and writes a POT; only plugin mode fills Project-Id-Version.
          package=$( sed -n 's/^"Project-Id-Version: \(.*\)\\n"$/\1/p' "${pots[0]}" )
          if [ -z "$package" ]; then
            echo "::error::${pots[0]} names no package in Project-Id-Version, so make-pot recognized no plugin and fell back to generic-project mode. Check that i18n-command is loaded once." >&2
            exit 1
          fi

          echo "Generated ${pots[0]} for $package"
      - name: Create plugin archive
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
        run: |
          wp --require="$RUNNER_TEMP/release-tools/vendor/autoload.php" dist-archive . "./$PLUGIN_SLUG.zip" --plugin-dirname="$PLUGIN_SLUG"
      - name: Upload the archive for the smoke and publish jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-zip
          path: ./${{ inputs.plugin-slug }}.zip
          retention-days: 1

  # The artifact differs from the tested tree (production dependencies, a regenerated POT, .distignore filtering), so it is installed and activated once before publishing.
  smoke:
    name: Smoke test the artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
    env:
      # With no checkout there is no locked wp-env to run, so this job pins its own; Dependabot cannot see it.
      WP_ENV_VERSION: '11.15.0'
    steps:
      - name: Download the release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-zip
          path: smoke

      # wp-env takes a local plugin only as a directory path, so the zip is unpacked and named absolutely; a broken tree or an activation fatal then fails the start.
      - name: Write the smoke wp-env config
        env:
          EXTRA_PLUGINS: ${{ inputs.extra-plugins }}
          PHP_VERSION: ${{ inputs.php-version }}
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
        run: |
          zip_file="smoke/$PLUGIN_SLUG.zip"
          if [ ! -f "$zip_file" ]; then
            echo "::error::the downloaded artifact has no $PLUGIN_SLUG.zip — nothing to smoke test."
            exit 1
          fi
          unzip -q "$zip_file" -d smoke/unpacked
          plugin_dir="$PWD/smoke/unpacked/$PLUGIN_SLUG"
          if [ ! -d "$plugin_dir" ]; then
            echo "::error::the artifact does not unpack to a $PLUGIN_SLUG directory; check the --plugin-dirname the build passes to wp dist-archive."
            exit 1
          fi
          # WordPress refuses to activate a plugin whose Requires PHP exceeds the environment's; one environment is enough.
          jq -n --arg plugin "$plugin_dir" --arg php "$PHP_VERSION" --argjson extra "$EXTRA_PLUGINS" \
            '{ plugins: ( $extra + [$plugin] ), phpVersion: $php, testsEnvironment: false }' > .wp-env.json
          cat .wp-env.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'

      - name: Start wp-env with the artifact installed
        run: npx --yes @wordpress/env@"$WP_ENV_VERSION" start

      - name: Assert the plugin is active and the site serves
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
        run: |
          npx --yes @wordpress/env@"$WP_ENV_VERSION" run cli wp plugin is-active "$PLUGIN_SLUG"
          # A boot-path fatal that survives activation surfaces on the next request.
          curl --fail --silent --show-error --output /dev/null http://localhost:8888/

      - name: Run the extra smoke assertions
        if: inputs.extra-smoke-commands != '[]'
        env:
          EXTRA_SMOKE_COMMANDS: ${{ inputs.extra-smoke-commands }}
        run: |
          # set -f keeps an entry from glob-expanding against workspace files; the unquoted word-split into wp-cli arguments is the intended contract.
          # pipefail makes malformed JSON fail the step instead of running zero assertions.
          set -e -f -o pipefail
          echo "$EXTRA_SMOKE_COMMANDS" | jq -r '.[]' | while IFS= read -r smoke_command; do
            # wp-env run passes its stdin into the container, which would drain the remaining entries after the first.
            # shellcheck disable=SC2086
            npx --yes @wordpress/env@"$WP_ENV_VERSION" run cli wp $smoke_command < /dev/null > /dev/null
          done

      - name: Stop wp-env
        if: always()
        run: npx --yes @wordpress/env@"$WP_ENV_VERSION" stop

  publish:
    name: Publish the release
    needs: [smoke, provenance]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the smoke-tested archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-zip
          path: ${{ runner.temp }}/release
      - name: Collect the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # index() matches the heading as text; a regex would read the version's . and + as operators.
          awk -v v="$version" '
            index($0, "## " v " ") == 1 || index($0, "## [" v "] ") == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          # A version with no changelog section would otherwise ship as a release describing nothing.
          test -s "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag)
          # A hyphenated SemVer tag is a prerelease and must not become the latest release.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release/$PLUGIN_SLUG.zip" "${args[@]}"
