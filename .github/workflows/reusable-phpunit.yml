name: PHPUnit

on:
  workflow_call:
    inputs:
      project-path:
        description: 'Path to the project (relative to repo root)'
        type: string
        required: false
        default: '.'
      php-version:
        description: 'PHP version on the runner, which runs Composer and any suite that does not use wp-env. Suites inside wp-env run on the phpVersion of its config file.'
        type: string
        required: false
        default: '8.5'
      wp-version:
        description: 'WordPress release to run, as a WordPress/WordPress tag name. Leave empty to defer to the `core` setting in the project''s wp-env config file (or wp-env''s default, the latest stable release).'
        type: string
        required: false
        default: ''
      wp-env-core:
        description: 'Full WP_ENV_CORE value. Overrides wp-version when set. Accepts repo refs (Org/Repo#ref) or zip URLs.'
        type: string
        required: false
        default: ''
      composer-script:
        description: 'Composer script to invoke for the test run (e.g., test, test:integration).'
        type: string
        required: false
        default: 'test'
      wp-env-config-file:
        description: 'Path to a wp-env config file (relative to project-path). Leave empty to use the default .wp-env.json. Use a separate file per environment (e.g., .wp-env.tests.json) to migrate off the deprecated implicit dev/tests split.'
        type: string
        required: false
        default: ''
      wp-env-xdebug:
        description: 'Value for wp-env start --xdebug=<mode>; e.g. ''coverage'' for in-container coverage drivers. Leave empty to start without Xdebug.'
        type: string
        required: false
        default: ''
      needs-wp-env:
        description: 'Set false for unit-only suites that do not need a WordPress runtime. When true the npm ci, wp-env start, and wp-env stop steps run, and a package.json plus package-lock.json declaring @wordpress/env are required — the workflow runs the wp-env the lockfile pins; false skips all three.'
        type: boolean
        required: false
        default: true

permissions: {}

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ inputs.php-version }} / WP ${{ inputs.wp-env-core != '' && inputs.wp-env-core || inputs.wp-version != '' && inputs.wp-version || (inputs.needs-wp-env && 'consumer-default' || 'no-wp-env') }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Job-level, so a consumer script that starts wp-env again runs the same WordPress as the start step.
      # Override priority: wp-env-core (full value) > wp-version (formatted as tag). Both empty leaves
      # WP_ENV_CORE empty, and wp-env falls back to the config file's `core` setting.
      WP_ENV_CORE: ${{ inputs.wp-env-core != '' && inputs.wp-env-core || (inputs.wp-version != '' && format('WordPress/WordPress#tags/{0}', inputs.wp-version)) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2

      - name: Setup Node.js (for wp-env)
        if: ${{ inputs.needs-wp-env }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: ${{ inputs.project-path }}/package-lock.json

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: ${{ inputs.project-path }}
          composer-options: '--prefer-dist --ignore-platform-req=php+'

      - name: Install npm dependencies
        if: ${{ inputs.needs-wp-env }}
        working-directory: ${{ inputs.project-path }}
        run: |
          npm ci
          # The project's own wp-env drives the environment below, so CI runs the version its
          # lockfile pins — and `npm ci` cannot conjure a package the project does not declare.
          if [ ! -x ./node_modules/.bin/wp-env ]; then
            echo "::error::@wordpress/env is not installed in this project — add it to devDependencies. This workflow runs the version the project's lockfile pins."
            exit 1
          fi

      - name: Start wp-env
        if: ${{ inputs.needs-wp-env }}
        working-directory: ${{ inputs.project-path }}
        env:
          WP_ENV_CONFIG_FILE: ${{ inputs.wp-env-config-file }}
          WP_ENV_XDEBUG: ${{ inputs.wp-env-xdebug }}
        run: |
          args=()
          if [ -n "$WP_ENV_CONFIG_FILE" ]; then
            args+=(--config "$WP_ENV_CONFIG_FILE")
          fi
          if [ -n "$WP_ENV_XDEBUG" ]; then
            args+=(--xdebug="$WP_ENV_XDEBUG")
          fi
          ./node_modules/.bin/wp-env start "${args[@]}"

      - name: Run tests
        working-directory: ${{ inputs.project-path }}
        env:
          COMPOSER_SCRIPT: ${{ inputs.composer-script }}
        run: composer "$COMPOSER_SCRIPT"

      - name: Stop wp-env
        if: ${{ always() && inputs.needs-wp-env }}
        working-directory: ${{ inputs.project-path }}
        env:
          WP_ENV_CONFIG_FILE: ${{ inputs.wp-env-config-file }}
        run: |
          # Teardown runs on failure too, including a failure that happened before the binary existed.
          [ -x ./node_modules/.bin/wp-env ] || exit 0
          args=()
          if [ -n "$WP_ENV_CONFIG_FILE" ]; then
            args+=(--config "$WP_ENV_CONFIG_FILE")
          fi
          ./node_modules/.bin/wp-env stop "${args[@]}"
