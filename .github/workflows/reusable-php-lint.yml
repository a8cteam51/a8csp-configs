name: PHP Lint

on:
  workflow_call:
    inputs:
      scripts:
        description: 'Non-empty JSON array of composer scripts; they run in order in one job, and each runs even after another fails.'
        type: string
        required: true
      project-path:
        description: 'Path to the project (relative to repo root).'
        type: string
        required: false
        default: '.'

permissions: {}

jobs:
  # One job, not one per script: GitHub bills every job by the minute, rounded up, and each script
  # takes seconds once the dependencies are installed.
  lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # An empty array or an empty name lints nothing and passes: `composer ""` prints its help and exits
      # 0. The loop reads one name per line and Bash drops NUL bytes, so a name with a control character
      # can split in two or collapse to an empty name. jq reads every JSON document in its input, so the
      # input must be exactly one.
      - name: Validate the scripts input
        env:
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          if ! jq -s -e 'length == 1 and (.[0] | type == "array" and length > 0 and all(.[]; type == "string" and length > 0 and (explode | all(. > 31 and (. < 127 or . > 159)))))' <<< "$SCRIPTS" > /dev/null; then
            echo "::error::scripts must be a non-empty JSON array of non-empty script names without control characters, as one JSON document — got '$SCRIPTS'."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      # Fails when composer.lock is out of date with composer.json or validate reports any warning,
      # which the dependency install only warns about.
      - name: composer validate --strict
        working-directory: ${{ inputs.project-path }}
        run: composer validate --strict

      # Runs after a failed validate too, so one push reports every problem.
      - name: Install Composer dependencies
        id: install
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: ${{ inputs.project-path }}
          composer-options: '--prefer-dist --ignore-platform-req=php+'

      - name: Run the lint scripts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ inputs.project-path }}
        env:
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          set -uo pipefail

          failed=()
          while IFS= read -r script; do
            echo "::group::composer $script"
            # stdin feeds this loop, so a script must not be able to read the names after its own.
            if ! composer "$script" < /dev/null; then
              failed+=("$script")
            fi
            echo '::endgroup::'
          done < <(jq -r '.[]' <<< "$SCRIPTS")

          if (( ${#failed[@]} > 0 )); then
            echo "::error::failed composer scripts: ${failed[*]}"
            exit 1
          fi
