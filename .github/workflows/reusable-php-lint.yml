name: PHP Lint

on:
  workflow_call:
    inputs:
      scripts:
        description: 'Non-empty JSON array of composer scripts; they run in order in one job, and each runs even after another fails.'
        type: string
        required: true
      project-path:
        description: 'Path to the project (relative to repo root).'
        type: string
        required: false
        default: '.'

permissions: {}

jobs:
  # One job, not one per script: GitHub bills every job by the minute, rounded up, and each script
  # takes seconds once the dependencies are installed.
  lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # An empty array would lint nothing and pass.
      - name: Reject an empty scripts array
        env:
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' <<< "$SCRIPTS" > /dev/null; then
            echo "::error::scripts must be a non-empty JSON array of strings — got '$SCRIPTS'."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      # Fails when composer.lock is out of date with composer.json or validate reports any warning,
      # which the dependency install only warns about.
      - name: composer validate --strict
        working-directory: ${{ inputs.project-path }}
        run: composer validate --strict

      # Runs after a failed validate too, so one push reports every problem.
      - name: Install Composer dependencies
        id: install
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: ${{ inputs.project-path }}
          composer-options: '--prefer-dist --ignore-platform-req=php+'

      - name: Run the lint scripts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ inputs.project-path }}
        env:
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          set -uo pipefail

          failed=()
          while IFS= read -r script; do
            echo "::group::composer $script"
            if ! composer "$script"; then
              failed+=("$script")
            fi
            echo '::endgroup::'
          done < <(jq -r '.[]' <<< "$SCRIPTS")

          if (( ${#failed[@]} > 0 )); then
            echo "::error::failed composer scripts: ${failed[*]}"
            exit 1
          fi
