name: CodeQL

on:
  workflow_call:
    inputs:
      languages:
        # CodeQL ships no PHP analyzer; PHP is statically analysed by PHPStan in the Quality workflow.
        description: 'Non-empty JSON array of CodeQL languages'
        type: string
        required: false
        default: '["actions"]'

permissions: {}

jobs:
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # An empty JSON array expands to zero matrix jobs and reports success — a silent skip of the security scan.
      - name: Reject an empty languages array
        env:
          LANGUAGES: ${{ inputs.languages }}
        run: |
          if ! jq -e 'type == "array" and length > 0' <<< "$LANGUAGES" > /dev/null; then
            echo "::error::languages must be a non-empty JSON array — got '$LANGUAGES'."
            exit 1
          fi

  detect-ghas:
    name: Detect GHAS availability
    runs-on: ubuntu-latest
    permissions:
      security-events: read
    outputs:
      ghas-available: ${{ steps.detect.outputs.ghas-available }}
    steps:
      - name: Detect GitHub Advanced Security availability
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # code-scanning/alerts is GHAS-gated: a 200 (even an empty list) means the feature is
          # available; a 403 naming Advanced Security is the exact failure CodeQL's own SARIF upload
          # would hit on a private repo without the feature, so probing this surfaces it before
          # analyze ever runs. Any other outcome is untrusted and fails closed to "unavailable" — a
          # transient API error must never let analyze run against a repo that will then hard-fail on
          # upload.
          probe_body="${RUNNER_TEMP}/ghas-probe.json"
          http_code=$(curl -s --max-time 15 -o "$probe_body" -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/code-scanning/alerts?per_page=1") || http_code="curl-error"

          case "$http_code" in
            200)
              echo "ghas-available=true" >> "$GITHUB_OUTPUT"
              ;;
            403)
              if grep -q 'Advanced Security must be enabled' "$probe_body" 2>/dev/null; then
                echo "::notice::GitHub Advanced Security is unavailable on this repository — CodeQL analyze is skipped."
                echo "ghas-available=false" >> "$GITHUB_OUTPUT"
              else
                echo "::warning::GHAS availability probe returned an unrecognized 403 body — treating GHAS as unavailable."
                echo "ghas-available=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "::warning::GHAS availability probe returned unexpected status '$http_code' — treating GHAS as unavailable."
              echo "ghas-available=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: [validate-inputs, detect-ghas]
    if: needs.detect-ghas.outputs.ghas-available == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          category: '/language:${{ matrix.language }}'
