name: CodeQL

on:
  workflow_call:
    inputs:
      languages:
        # CodeQL ships no PHP analyzer; PHPStan covers PHP.
        description: 'Non-empty JSON array of CodeQL languages'
        type: string
        required: false
        default: '["actions"]'

permissions: {}

jobs:
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      # An empty JSON array expands to zero matrix jobs and reports success — a silent skip of the security scan.
      - name: Reject an empty languages array
        env:
          LANGUAGES: ${{ inputs.languages }}
        run: |
          if ! jq -e 'type == "array" and length > 0' <<< "$LANGUAGES" > /dev/null; then
            echo "::error::languages must be a non-empty JSON array — got '$LANGUAGES'."
            exit 1
          fi

  detect-ghas:
    name: Detect GHAS availability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: read
    outputs:
      ghas-available: ${{ steps.detect.outputs.ghas-available }}
    steps:
      - name: Detect GitHub Advanced Security availability
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # code-scanning/alerts is GHAS-gated: 200 means available, a 403 naming Advanced Security means
          # absent. Anything else is retried, then treated as available: a skipped analyze would pass as a
          # green check, so a repository really missing GHAS must fail visibly on SARIF upload instead.
          probe_body="${RUNNER_TEMP}/ghas-probe.json"
          max_attempts=3
          retry_sleep_seconds=5
          attempt=1
          while :; do
            http_code=$(curl -s --max-time 15 -o "$probe_body" -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/code-scanning/alerts?per_page=1") || http_code="curl-error"

            if [ "$http_code" = "200" ]; then
              echo "ghas-available=true" >> "$GITHUB_OUTPUT"
              break
            fi

            if [ "$http_code" = "403" ] && grep -q 'Advanced Security must be enabled' "$probe_body" 2>/dev/null; then
              echo "::notice::GitHub Advanced Security is unavailable on this repository — CodeQL analyze is skipped."
              echo "ghas-available=false" >> "$GITHUB_OUTPUT"
              break
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              attempt=$((attempt + 1))
              sleep "$retry_sleep_seconds"
              continue
            fi

            echo "::warning::GHAS availability probe was ambiguous after $max_attempts attempts (last status '$http_code') — assuming GHAS is available so analyze runs; a genuine absence then fails visibly on SARIF upload instead of silently skipping as a passing required check."
            echo "ghas-available=true" >> "$GITHUB_OUTPUT"
            break
          done

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: [validate-inputs, detect-ghas]
    if: needs.detect-ghas.outputs.ghas-available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: '/language:${{ matrix.language }}'
