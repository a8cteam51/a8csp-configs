name: Workflow Checks
# Callers grant `contents: read`, `actions: read` and `security-events: write`; a caller must grant every permission the called jobs declare, or the call fails at startup.

on:
  workflow_call:
    inputs:
      zizmor-inputs:
        description: 'The path zizmor audits for consumers that must exclude vendored third-party workflow files.'
        type: string
        required: false
        default: '.'

permissions: {}

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  detect-ghas:
    name: Detect GHAS availability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: read
    outputs:
      ghas-available: ${{ steps.detect.outputs.ghas-available }}
    steps:
      - name: Detect GitHub Advanced Security availability
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # code-scanning/alerts is GHAS-gated: 200 means available, a 403 naming Advanced Security means
          # absent. Anything else is retried, then treated as unavailable: native mode still scans and
          # fails on any finding, so a wrong guess costs only the Security-tab upload.
          probe_body="${RUNNER_TEMP}/ghas-probe.json"
          max_attempts=3
          retry_sleep_seconds=5
          attempt=1
          while :; do
            http_code=$(curl -s --max-time 15 -o "$probe_body" -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/code-scanning/alerts?per_page=1") || http_code="curl-error"

            if [ "$http_code" = "200" ]; then
              echo "ghas-available=true" >> "$GITHUB_OUTPUT"
              break
            fi

            if [ "$http_code" = "403" ] && grep -q 'Advanced Security must be enabled' "$probe_body" 2>/dev/null; then
              echo "::notice::GitHub Advanced Security is unavailable on this repository — zizmor still runs and fails on findings; only the Security-tab upload is skipped."
              echo "ghas-available=false" >> "$GITHUB_OUTPUT"
              break
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              attempt=$((attempt + 1))
              sleep "$retry_sleep_seconds"
              continue
            fi

            echo "::warning::GHAS availability probe was ambiguous after $max_attempts attempts (last status '$http_code') — treating GHAS as unavailable; zizmor still runs and fails on findings, so only the Security-tab upload is skipped."
            echo "ghas-available=false" >> "$GITHUB_OUTPUT"
            break
          done

  zizmor:
    name: Zizmor
    needs: detect-ghas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    env:
      # Both modes run this one version, so findings never depend on the mode.
      ZIZMOR_VERSION: '1.29.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        id: zizmor
        if: needs.detect-ghas.outputs.ghas-available == 'true'
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: ${{ inputs.zizmor-inputs }}
          version: ${{ env.ZIZMOR_VERSION }}

      # Native mode: zizmor's own exit fails the job on any finding, annotated inline.
      - name: Run zizmor without Advanced Security
        if: needs.detect-ghas.outputs.ghas-available == 'false'
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: ${{ inputs.zizmor-inputs }}
          version: ${{ env.ZIZMOR_VERSION }}
          advanced-security: false
          annotations: true

      # Advanced Security mode never fails the job, so this count gate is what blocks CI on that branch.
      - name: Fail on zizmor findings
        if: needs.detect-ghas.outputs.ghas-available == 'true'
        env:
          SARIF: ${{ steps.zizmor.outputs.output-file }}
        run: |
          # Fail closed: only a well-formed SARIF with a single integer result count is a known result.
          if [ ! -s "$SARIF" ]; then
            echo "::error::zizmor produced no SARIF at '$SARIF' — cannot confirm a clean scan."
            exit 1
          fi
          if ! count=$(jq 'if (.runs | type) == "array" then reduce .runs[] as $r (0; . + (($r.results // []) | if type == "array" then length else error("run.results is not an array") end)) else error("not a SARIF document") end' "$SARIF"); then
            echo "::error::zizmor SARIF at '$SARIF' is missing or malformed — cannot confirm a clean scan."
            exit 1
          fi
          case "$count" in
            '' | *[!0-9]*)
              echo "::error::unexpected zizmor finding count '$count' — cannot confirm a clean scan."
              exit 1
              ;;
          esac
          echo "zizmor reported $count finding(s)."
          if [ "$count" -ne 0 ]; then
            echo "::error::zizmor reported $count finding(s) — see the Security tab."
            exit 1
          fi
