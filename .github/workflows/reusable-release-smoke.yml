name: Release Smoke Test
# The release artifact differs materially from the tested tree (production dependencies, a regenerated POT, .distignore filtering), so it gets installed and activated once before publishing.

on:
  workflow_call:
    inputs:
      zip-artifact:
        description: 'Name of the uploaded artifact containing the built plugin zip.'
        type: string
        required: true
      plugin-slug:
        description: 'The plugin directory slug the zip unpacks to (wp dist-archive --plugin-dirname).'
        type: string
        required: true
      extra-plugins:
        description: 'JSON array of additional wp-env plugin sources (e.g. a host plugin zip URL) installed alongside the artifact.'
        type: string
        required: false
        default: '[]'
      php-version:
        description: 'PHP version wp-env runs. Must satisfy the plugin header "Requires PHP" or WordPress refuses to activate the artifact. Empty leaves wp-env on its own default.'
        type: string
        required: false
        default: ''
      extra-smoke-commands:
        description: 'JSON array of wp-cli argument strings (everything after "wp") run as additional smoke assertions, e.g. ["help my-command"].'
        type: string
        required: false
        default: '[]'
      node-version:
        description: 'Node.js version for wp-env CLI'
        type: string
        required: false
        default: '26'

permissions: {}

env:
  # The only wp-env version this repository chooses. The other workflows run the consumer's own
  # locked binary, which this job has none of: it smoke-tests a downloaded artifact in a directory
  # with no checkout and no package.json, so an explicit version is the only thing available. Nothing
  # bumps it automatically — an npx-inline version is invisible to dependabot.
  WP_ENV_VERSION: '11.13.0'

jobs:
  smoke:
    name: Install and activate the release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
    steps:
      - name: Download the release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.zip-artifact }}
          path: smoke

      # wp-env installs and activates every listed plugin during start, so a zip whose tree
      # is broken (missing autoloader, filtered-out runtime file, activation fatal) fails here.
      # wp-env resolves a plugin source three ways: an absolute or ./-prefixed path as a local directory, an http(s) .zip as a download, and anything else as a GitHub owner/repo — a local archive matches none of them, so the artifact is unpacked and the directory it produces is named absolutely.
      - name: Write the smoke wp-env config
        env:
          EXTRA_PLUGINS: ${{ inputs.extra-plugins }}
          PHP_VERSION: ${{ inputs.php-version }}
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
        run: |
          zip_file=$(find smoke -name '*.zip' -print -quit)
          if [ -z "$zip_file" ]; then
            echo "::error::No plugin zip found in the downloaded artifact — nothing to smoke test."
            exit 1
          fi
          unzip -q "$zip_file" -d smoke/unpacked
          plugin_dir="$PWD/smoke/unpacked/$PLUGIN_SLUG"
          if [ ! -d "$plugin_dir" ]; then
            echo "::error::The artifact does not unpack to a $PLUGIN_SLUG directory; check the --plugin-dirname the build passes to wp dist-archive."
            exit 1
          fi
          # A declared PHP floor above wp-env's default makes WordPress refuse activation, which reads as a broken artifact rather than an environment that cannot host it.
          jq -n --arg plugin "$plugin_dir" --arg php "$PHP_VERSION" --argjson extra "$EXTRA_PLUGINS" \
            '{ plugins: ( $extra + [$plugin] ) } + ( if $php == "" then {} else { phpVersion: $php } end )' > .wp-env.json
          cat .wp-env.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Start wp-env with the artifact installed
        run: npx --yes @wordpress/env@"$WP_ENV_VERSION" start

      - name: Assert the plugin is active and the site serves
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
        run: |
          npx --yes @wordpress/env@"$WP_ENV_VERSION" run cli wp plugin is-active "$PLUGIN_SLUG"
          # A boot-path fatal that survives activation surfaces on the next request.
          curl --fail --silent --show-error --output /dev/null http://localhost:8888/

      - name: Run the extra smoke assertions
        if: inputs.extra-smoke-commands != '[]'
        env:
          EXTRA_SMOKE_COMMANDS: ${{ inputs.extra-smoke-commands }}
        run: |
          # set -f keeps an entry from glob-expanding against workspace files; the unquoted word-split into wp-cli arguments is the intended contract.
          set -f
          echo "$EXTRA_SMOKE_COMMANDS" | jq -r '.[]' | while IFS= read -r smoke_command; do
            # shellcheck disable=SC2086
            npx --yes @wordpress/env@"$WP_ENV_VERSION" run cli wp $smoke_command > /dev/null
          done

      - name: Stop wp-env
        if: always()
        run: npx --yes @wordpress/env@"$WP_ENV_VERSION" stop
