name: Release Smoke Test
# The release artifact differs materially from the tested tree (production dependencies, rebuilt assets, .distignore filtering), so it gets installed and activated once before publishing.

on:
  workflow_call:
    inputs:
      zip-artifact:
        description: 'Name of the uploaded artifact containing the built plugin zip.'
        type: string
        required: true
      plugin-slug:
        description: 'The plugin directory slug the zip unpacks to (wp dist-archive --plugin-dirname).'
        type: string
        required: true
      extra-plugins:
        description: 'JSON array of additional wp-env plugin sources (e.g. a host plugin zip URL) installed alongside the artifact.'
        type: string
        required: false
        default: '[]'
      node-version:
        description: 'Node.js version for wp-env CLI'
        type: string
        required: false
        default: '26'

permissions: {}

env:
  # WP_ENV_VERSION is pinned identically in reusable-phpunit.yml, reusable-playwright-e2e.yml, and reusable-release-smoke.yml and must stay in sync — npx-inline @wordpress/env versions are invisible to dependabot, so nothing bumps them together automatically.
  WP_ENV_VERSION: '11.9.0'

jobs:
  smoke:
    name: Install and activate the release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
    steps:
      - name: Download the release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.zip-artifact }}
          path: smoke

      # wp-env installs and activates every listed plugin during start, so a zip whose tree
      # is broken (missing autoloader, filtered-out runtime file, activation fatal) fails here.
      - name: Write the smoke wp-env config
        env:
          EXTRA_PLUGINS: ${{ inputs.extra-plugins }}
        run: |
          zip_file=$(find smoke -name '*.zip' -print -quit)
          if [ -z "$zip_file" ]; then
            echo "::error::No plugin zip found in the downloaded artifact — nothing to smoke test."
            exit 1
          fi
          jq -n --arg zip "$zip_file" --argjson extra "$EXTRA_PLUGINS" '{ plugins: ( $extra + [$zip] ) }' > .wp-env.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Start wp-env with the artifact installed
        run: npx --yes @wordpress/env@"$WP_ENV_VERSION" start

      - name: Assert the plugin is active and the site serves
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
        run: |
          npx --yes @wordpress/env@"$WP_ENV_VERSION" run cli wp plugin is-active "$PLUGIN_SLUG"
          # A boot-path fatal that survives activation surfaces on the next request.
          curl --fail --silent --show-error --output /dev/null http://localhost:8888/

      - name: Stop wp-env
        if: always()
        run: npx --yes @wordpress/env@"$WP_ENV_VERSION" stop
