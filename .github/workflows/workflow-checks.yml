name: Workflow Checks

on:
  pull_request:
    paths: ['.github/workflows/**']
  push:
    branches: [trunk]
    paths: ['.github/workflows/**']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  workflow-checks:
    # A caller must grant every permission the called jobs declare, or the call fails at startup.
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/reusable-workflow-checks.yml
