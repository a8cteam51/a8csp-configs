name: Workflow checks

on:
  pull_request:
    paths: ['.github/workflows/**']
  push:
    branches: [trunk]
    paths: ['.github/workflows/**']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  workflow-checks:
    permissions:
      contents: read
      # zizmor's SARIF upload in the called workflow needs this — a reusable
      # workflow can never escalate beyond what this job grants.
      security-events: write
      # The called workflow's zizmor job also requests `actions: read` (to scan
      # workflow metadata) — omitting it here makes the whole reusable-workflow
      # call invalid and aborts the run before any job starts.
      actions: read
    uses: ./.github/workflows/reusable-workflow-checks.yml

  # The WP_ENV_VERSION pins in reusable-phpunit.yml, reusable-playwright-e2e.yml, and
  # reusable-release-smoke.yml must stay identical — npx-inline @wordpress/env versions are
  # invisible to dependabot, so nothing bumps them together automatically. This job fails when
  # any of the three pins drift.
  wp-env-version-sync:
    name: wp-env version pins in sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Assert WP_ENV_VERSION pins match
        run: |
          extract() {
            sed -n "s/^[[:space:]]*WP_ENV_VERSION:[[:space:]]*'\([^']*\)'.*/\1/p" "$1"
          }
          phpunit=$(extract .github/workflows/reusable-phpunit.yml)
          playwright=$(extract .github/workflows/reusable-playwright-e2e.yml)
          release_smoke=$(extract .github/workflows/reusable-release-smoke.yml)
          if [ -z "$phpunit" ] || [ -z "$playwright" ] || [ -z "$release_smoke" ]; then
            echo "::error::could not extract a WP_ENV_VERSION pin (phpunit='$phpunit', playwright='$playwright', release-smoke='$release_smoke') — the env line moved or changed quoting."
            exit 1
          fi
          if [ "$phpunit" != "$playwright" ] || [ "$phpunit" != "$release_smoke" ]; then
            echo "::error::WP_ENV_VERSION pins differ: reusable-phpunit.yml has '$phpunit', reusable-playwright-e2e.yml has '$playwright', reusable-release-smoke.yml has '$release_smoke' — they must stay identical."
            exit 1
          fi
          echo "WP_ENV_VERSION pins match: $phpunit"
