name: Quality

on:
  pull_request:
    paths:
      - 'php/quality-assurance/**'
      - 'node/**'
      - 'eslint.config.mjs'
      - 'tests/**'
      - 'package.json'
      - 'composer.json'
      - 'composer.lock'
      - 'package-lock.json'
      - 'phpunit.dist.xml'
      - '.github/workflows/quality.yml'
      - '.github/workflows/reusable-block-json-check.yml'
      - '.github/workflows/reusable-phpunit.yml'
      - '.github/workflows/reusable-supply-chain-audit.yml'
  push:
    branches: [trunk]
    paths:
      - 'php/quality-assurance/**'
      - 'node/**'
      - 'eslint.config.mjs'
      - 'tests/**'
      - 'package.json'
      - 'composer.json'
      - 'composer.lock'
      - 'package-lock.json'
      - 'phpunit.dist.xml'
      - '.github/workflows/quality.yml'
      - '.github/workflows/reusable-block-json-check.yml'
      - '.github/workflows/reusable-phpunit.yml'
      - '.github/workflows/reusable-supply-chain-audit.yml'
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpcs-smoke:
    name: PHPCS dist-file smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      # phpcs -e loads the ruleset without scanning, proving the XML parses and every <rule ref> resolves.
      - name: Explain php/quality-assurance/phpcs.dist.xml
        run: vendor/bin/phpcs -e --standard=php/quality-assurance/phpcs.dist.xml

      - name: Explain php/quality-assurance/phpcs.tests.dist.xml
        run: vendor/bin/phpcs -e --standard=php/quality-assurance/phpcs.tests.dist.xml

      - name: Scan fixture with php/quality-assurance/phpcs.dist.xml
        shell: bash
        run: |
          set -e -o pipefail
          # phpcs.dist.xml excludes */tests/*, so a copy outside that path is scanned.
          cp -R tests/fixtures/plugin-stub "$RUNNER_TEMP/plugin-stub"
          vendor/bin/phpcs -v --standard=php/quality-assurance/phpcs.dist.xml "$RUNNER_TEMP/plugin-stub" | tee phpcs-scan.log
          # The ruleset's own exclude-patterns can silently empty the file list, and an empty scan proves nothing.
          ! grep -qF '(0 files in queue)' phpcs-scan.log

      # An exclude-pattern in the shared base applies to both profiles; a */tests/* one would leave this scan empty.
      - name: Scan a tests/ fixture with php/quality-assurance/phpcs.tests.dist.xml
        shell: bash
        run: |
          set -e -o pipefail
          mkdir -p "$RUNNER_TEMP/consumer/tests"
          cp tests/fixtures/plugin-stub/src/Example.php "$RUNNER_TEMP/consumer/tests/Example.php"
          vendor/bin/phpcs -v --standard=php/quality-assurance/phpcs.tests.dist.xml "$RUNNER_TEMP/consumer/tests" | tee phpcs-tests-scan.log
          ! grep -qF '(0 files in queue)' phpcs-tests-scan.log

      # Stable PHPCompatibility releases lack the current-PHP sniffs; only the pre-release codes prove them present.
      - name: Assert the PHPCompatibility sniffs are not vacuous
        shell: bash
        run: |
          set -e -o pipefail
          cp -R tests/fixtures/php-compat "$RUNNER_TEMP/php-compat"
          # CSV keeps sniff codes on one unwrapped field; a reported fixture exits non-zero, so the greps are the gate.
          vendor/bin/phpcs -q --no-colors --report=csv --standard=php/quality-assurance/phpcs.dist.xml "$RUNNER_TEMP/php-compat" > phpcs-compat.csv || true
          cat phpcs-compat.csv
          grep -qF 'PHPCompatibility.TextStrings.RemovedDollarBraceStringEmbeds.DeprecatedVariableSyntax' phpcs-compat.csv
          grep -qF 'PHPCompatibility.FunctionUse.RemovedFunctions.utf8_encodeDeprecated' phpcs-compat.csv

  phpstan-smoke:
    name: PHPStan dist-file smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      # phpstan.dist.neon includes phpstan.dist.neon.php, which discovers paths via getcwd(), so the
      # fixture (not the repo root) is cwd.
      - name: Analyze fixture with php/quality-assurance/phpstan.dist.neon
        working-directory: tests/fixtures/plugin-stub
        run: ../../../vendor/bin/phpstan analyse -c ../../../php/quality-assurance/phpstan.dist.neon --no-progress

  lint-config:
    name: Node lint and config smokes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Lint scripts
        run: npm run lint:scripts

      - name: Smoke-test shared Node configs
        run: npm run lint:config

  phpunit:
    name: PHPUnit
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-phpunit.yml
    with:
      needs-wp-env: false

  phpunit-wp-env:
    name: PHPUnit (wp-env fixture)
    # Runs the reusable's wp-env branch, which the unit job above skips, against a fixture consumer.
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-phpunit.yml
    with:
      project-path: tests/fixtures/wp-env-consumer
      composer-script: test:wp-env
      # The fixture asserts this exact version from inside the container; change both together.
      wp-version: '6.9.4'

  supply-chain:
    name: Supply-chain audit
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-supply-chain-audit.yml

  block-json:
    name: block.json schema check
    # This repository ships no blocks, so the check runs against a fixture.
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-block-json-check.yml
    with:
      project-path: tests/fixtures/block-json
