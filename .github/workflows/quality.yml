name: Quality

on:
  pull_request:
    paths:
      - 'php/quality-assurance/**'
      - 'node/**'
      - 'eslint.config.mjs'
      - 'tests/**'
      - 'package.json'
      - 'composer.json'
      - 'composer.lock'
      - 'package-lock.json'
      - 'phpunit.dist.xml'
      - '.github/workflows/quality.yml'
  push:
    branches: [trunk]
    paths:
      - 'php/quality-assurance/**'
      - 'node/**'
      - 'eslint.config.mjs'
      - 'tests/**'
      - 'package.json'
      - 'composer.json'
      - 'composer.lock'
      - 'package-lock.json'
      - 'phpunit.dist.xml'
      - '.github/workflows/quality.yml'
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpcs-smoke:
    name: PHPCS dist-file smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      # phpcs -e loads the ruleset and lists its sniffs without scanning any file — the
      # cheapest possible proof that the XML parses and every <rule ref> still resolves.
      - name: Explain php/quality-assurance/phpcs.dist.xml
        run: vendor/bin/phpcs -e --standard=php/quality-assurance/phpcs.dist.xml

      # The companion tests-profile ruleset ships too; -e proves it parses and every <rule ref> resolves.
      - name: Explain php/quality-assurance/phpcs.tests.dist.xml
        run: vendor/bin/phpcs -e --standard=php/quality-assurance/phpcs.tests.dist.xml

      - name: Scan fixture with php/quality-assurance/phpcs.dist.xml
        shell: bash
        run: |
          set -e -o pipefail
          # phpcs.dist.xml excludes */tests/*, so a temp copy is scanned outside that path — the
          # dedicated companion ruleset (phpcs.tests.dist.xml) is what lints tests/ itself.
          cp -R tests/fixtures/plugin-stub "$RUNNER_TEMP/plugin-stub"
          rm -f "$RUNNER_TEMP/plugin-stub/vendor"
          vendor/bin/phpcs -v --standard=php/quality-assurance/phpcs.dist.xml "$RUNNER_TEMP/plugin-stub" | tee phpcs-scan.log
          # The ruleset's own exclude-patterns can silently empty the file list, and an empty scan proves nothing.
          ! grep -qF '(0 files in queue)' phpcs-scan.log

  phpstan-smoke:
    name: PHPStan dist-file smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      # phpstan.dist.neon includes phpstan.dist.neon.php, which discovers paths via getcwd()
      # and resolves bootstrapFiles via %currentWorkingDirectory%. Both must resolve from
      # inside the fixture, so this step (not the repo root) is cwd.
      # tests/fixtures/plugin-stub/vendor is a symlink back to the package's own vendor/,
      # so the WordPress stubs bootstrap file resolves without a second composer install.
      - name: Analyse fixture with php/quality-assurance/phpstan.dist.neon
        working-directory: tests/fixtures/plugin-stub
        run: vendor/bin/phpstan analyse -c ../../../php/quality-assurance/phpstan.dist.neon --no-progress

  lint-scripts:
    name: Lint scripts (ESLint)
    # Dogfoods the repo's own scripts/styles reusable with lint-styles disabled (no CSS in this repo).
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-scripts-styles-lint.yml
    with:
      lint-styles: false

  lint-config:
    name: Node config smokes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Smoke-test shared Node configs
        run: npm run lint:config

  phpunit:
    name: PHPUnit
    # Dogfoods the repo's own PHPUnit reusable; the unit suite needs no WordPress runtime.
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-phpunit.yml
    with:
      needs-wp-env: false

  supply-chain:
    name: Supply-chain audit
    # npm gate audits production deps only — the dev-tooling graph (wp-scripts/playwright trees) is advisory via dependabot alerts.
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-supply-chain-audit.yml
    with:
      npm-audit-flags: '--omit=dev --audit-level=high'

  block-json:
    name: block.json schema check
    # Dogfoods reusable-block-json-check against a throwaway fixture; this tooling repo ships no real blocks.
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-block-json-check.yml
    with:
      project-path: tests/fixtures/block-json
