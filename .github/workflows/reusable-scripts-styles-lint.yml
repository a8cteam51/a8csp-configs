name: Scripts/Styles Lint

on:
  workflow_call:
    inputs:
      project-path:
        description: 'Path to the project (relative to repo root). npm ci runs here, so package.json and a package-lock.json must be present.'
        type: string
        required: false
        default: '.'
      lint-types:
        description: 'Run `npm run lint:types` (TypeScript). Set true for repos with TypeScript sources.'
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  lint:
    name: Lint scripts/styles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: ${{ inputs.project-path }}/package-lock.json

      # npm ci spends minutes laying out the tree even from a warm npm cache, so the installed tree is
      # cached whole, keyed by the exact Node.js version and lockfile.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.project-path }}/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles(format('{0}/package-lock.json', inputs.project-path)) }}

      - name: Install npm dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: ${{ inputs.project-path }}
        run: npm ci

      - name: Save node_modules
        if: steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.project-path }}/node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      - name: Lint scripts
        working-directory: ${{ inputs.project-path }}
        run: npm run lint:scripts

      - name: Lint styles
        working-directory: ${{ inputs.project-path }}
        run: npm run lint:styles

      - name: Lint types
        if: ${{ inputs.lint-types }}
        working-directory: ${{ inputs.project-path }}
        run: npm run lint:types
