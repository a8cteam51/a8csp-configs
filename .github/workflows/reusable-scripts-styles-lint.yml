name: Scripts/Styles Lint

on:
  workflow_call:
    inputs:
      project-path:
        description: 'Path to the project (relative to repo root). npm ci runs here, so package.json and a package-lock.json must be present.'
        type: string
        required: false
        default: '.'
      lint-types:
        description: 'Run `npm run lint:types` (TypeScript). Set true for repos with TypeScript sources.'
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  lint:
    name: Lint scripts/styles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: ${{ inputs.project-path }}/package-lock.json

      - name: Install npm dependencies
        working-directory: ${{ inputs.project-path }}
        run: npm ci

      - name: Lint scripts
        working-directory: ${{ inputs.project-path }}
        run: npm run lint:scripts

      - name: Lint styles
        working-directory: ${{ inputs.project-path }}
        run: npm run lint:styles

      - name: Lint types
        if: ${{ inputs.lint-types }}
        working-directory: ${{ inputs.project-path }}
        run: npm run lint:types
