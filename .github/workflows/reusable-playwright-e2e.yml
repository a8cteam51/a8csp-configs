name: Playwright E2E

on:
  workflow_call:
    inputs:
      project-path:
        description: 'Path to the project (relative to repo root). npm ci runs here, so package.json and a package-lock.json declaring @wordpress/env must be present — the workflow runs the wp-env the lockfile pins.'
        type: string
        required: false
        default: '.'
      wp-version:
        description: 'WordPress release to run, as a WordPress/WordPress tag name. Leave empty to defer to the `core` setting in the project''s .wp-env.json (or wp-env''s default, the latest stable release).'
        type: string
        required: false
        default: ''
      wp-env-core:
        description: 'Full WP_ENV_CORE value. Overrides wp-version when set. Accepts repo refs (Org/Repo#ref) or zip URLs.'
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Job-level, so a consumer script that starts wp-env again runs the same WordPress as the start step.
      # Override priority: wp-env-core (full value) > wp-version (formatted as tag). Both empty leaves
      # WP_ENV_CORE empty, and wp-env falls back to the config file's `core` setting.
      WP_ENV_CORE: ${{ inputs.wp-env-core != '' && inputs.wp-env-core || (inputs.wp-version != '' && format('WordPress/WordPress#tags/{0}', inputs.wp-version)) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: ${{ inputs.project-path }}/package-lock.json

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: ${{ inputs.project-path }}
          composer-options: '--prefer-dist --ignore-platform-req=php+'

      - name: Install npm dependencies
        working-directory: ${{ inputs.project-path }}
        run: |
          npm ci
          # The project's own wp-env drives the environment below, so CI runs the version its
          # lockfile pins — and `npm ci` cannot conjure a package the project does not declare.
          if [ ! -x ./node_modules/.bin/wp-env ]; then
            echo "::error::@wordpress/env is not installed in this project — add it to devDependencies. This workflow runs the version the project's lockfile pins."
            exit 1
          fi

      - name: Resolve Playwright version
        id: playwright
        working-directory: ${{ inputs.project-path }}
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        working-directory: ${{ inputs.project-path }}
        run: npx playwright install --with-deps chromium

      - name: Start wp-env
        working-directory: ${{ inputs.project-path }}
        run: ./node_modules/.bin/wp-env start

      - name: Run Playwright tests
        working-directory: ${{ inputs.project-path }}
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          # The shared Playwright base points WP_ARTIFACTS_PATH here, and CI's `github` reporter writes no
          # HTML report, so traces and screenshots are the failure evidence.
          path: ${{ inputs.project-path }}/tests/.cache/artifacts
          retention-days: 7

      - name: Stop wp-env
        if: always()
        working-directory: ${{ inputs.project-path }}
        run: |
          # Teardown runs on failure too, including a failure that happened before the binary existed.
          [ -x ./node_modules/.bin/wp-env ] || exit 0
          ./node_modules/.bin/wp-env stop
